#### general settings
name: ir-sde
use_tb_logger: true
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

degradation:
  mask_root: /home/lab610/Impainting/dataset/dunhuang/strdiff_layout/train/masks
  
#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: GT
    dataroot_GT: /home/lab610/Impainting/dataset/dunhuang/strdiff_layout/train/images

    use_shuffle: true
    n_workers: 8
    batch_size: 32
    GT_size: 256
    use_flip: true
    use_rot: true
    color: RGB


#### network structures
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

#### path
path:
  pretrain_model_G: /home/lab610/Impainting/StrDiffusion+e1/train/texture/config/inpainting/log/ir-sde/models/20000.pth
  pretrain_model_Gs: /home/lab610/Impainting/StrDiffusion/test/texture/structure.pth
  strict_load: false  #该结构以后不能完全对应 改成false
  resume_state: /home/lab610/Impainting/StrDiffusion+e1/train/texture/config/inpainting/log/ir-sde/training_state/20000.state

#### training settings: learning rate scheme, loss
train:
  optimizer: Adam
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 80000   
  #niter: 8000000
  warmup_iter: 1000
  lr_steps: [2000, 35000, 60000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0



  # 是否启用冻结（小数据强烈建议 true）
  freeze_G: false

  # 只有当模型里真的有 brush 模块时才启用冻结（避免误伤 e0/e2 等）
  freeze_requires_brush: true

  # 冻结白名单：哪些参数允许训练（其余全部 requires_grad=False）
  freeze_trainable_prefixes:
    - "brush."
    - "brush_injector."

  # 允许用正则匹配（更灵活）
  freeze_trainable_regex:
    # SPADE guide：downs.{i}.4.*
    - "^downs\\.[0-9]+\\.4\\."
    # 输出头
    - "^final_res_block\\."
    - "^final_conv\\."




#### logger
logger:
  print_freq: 100
  #print_freq: 100
  # save_checkpoint_freq: !!float 5e3
  save_checkpoint_freq: 500
  keep_training_state: 3
