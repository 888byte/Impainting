#### general settings
name: ir-sde
use_tb_logger: true
model: denoising
distortion: derain
gpu_ids: [0]

sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks
  
#### datasets
datasets:
  train:
    name: Train_Dataset
    mode: GT
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/train/cropped_images

    use_shuffle: true
    n_workers: 8
    batch_size: 16
    GT_size: 256
    use_flip: true
    use_rot: true
    color: RGB


#### network structures
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 1
    out_nc: 1
    nf: 64
    depth: 4

#### path
path:
  pretrain_model_G: /home/lab610/Impainting/StrDiffusion+e00s/train/experiments/inpainting/ir-sde-350000/models/best_G.pth
  strict_load: false
  resume_state: /home/610-wws/Impainting/StrDiffusion+e00s/train/structure/config/inpainting/log/ir-sde/training_state/235000.state

#### training settings: learning rate scheme, loss
train:
  optimizer: Adam
  lr_G: !!float 0.0001
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.999
  niter: 3500000
  warmup_iter: 5000
  lr_steps: [80000,150000, 300000]
  lr_gamma: 0.5
  eta_min: !!float 1e-5

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: 10000
  use_tb_logger: true
