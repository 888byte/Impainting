#### BrushNet + MGLC-Tex finetune config
#### Usage:
####   python train.py -opt ./options/train/ir-sde-brushnet-ft.yml
#### Before running:
####   1. Replace path.pretrain_model_G with your last-stage final/latest weight.
####   2. Keep resume_state as ~ for a clean finetune stage.

name: ir-sde-brushnet-ft-x3
use_tb_logger: true
model: denoising
distortion: inpainting
gpu_ids: [0]

#### SDE
sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005
  # 降低high-timestep curriculum强度，减少训练不稳定性
  high_t_prob: 0.40
  high_t_min_ratio: 0.60

#### Degradation
degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

#### BrushNet
brushnet:
  enabled: true
  in_nc: 8
  nf: 64
  depth: 4
  lite: false
  prior_dropout_prob: 0.05
  #### Keep BrushNet as weak hole-only reference guidance.
  feature_scale: 0.30
  use_spatial_gate: true

#### Main trunk guidance compatibility field
#### Keep this disabled so the main repair path stays aligned with original
#### StrDiffusion semantics: cond/mu = observed_masked input.
main_guidance:
  enabled: false
  use_observed_input: true
  use_mask: true
  zero_init: true

#### Texture core
texture_core:
  enabled: true
  name: MGLCBlock
  insert_mid: true
  insert_dec: true
  backend: sem_lite
  branch_mode: both
  use_mask_gate: true
  gate_hidden: 16
  boundary_width: 3
  zero_init_last: true

#### Baseline compatibility fix
restore_S_guidance: true

#### Self-Supervised Mu-Denoiser
mu_denoiser:
  enabled: true
  in_nc: 5
  dim: 32
  num_blocks: 2
  num_heads: 4
  predict_residual: true
  blind_ratio: 0.1
  lambda_ss: 1.0
  lambda_tv: 0.01
  lr: !!float 5e-5
  sde_warmup_iter: 1000

#### Dataset
datasets:
  train:
    name: MuralInpainting_Dataset
    mode: mural_inpainting
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/train/cropped_images
    dataroot_mask: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

    #### full: 整图颜色恢复 + 修补
    #### partial: 已知区尽量保留，仅 hole 区使用 LUT 目标
    gt_mode: full

    #### 必须显式提供 LUT 文件，不再回退旧默认值
    lut_path: /home/610-wws/Impainting/SSD-TS/pigment_lut49_xhq.npz
    lut_alpha: 0.85
    lut_beta: 0.15
    lut_inpaint_method: telea
    lut_strength: 1.0
    lut_smooth_radius: 1
    prior_hole_max_weight: 0.5
    prior_lut_gap_scale: 0.15
    #### Expand inpaint mask internally to prevent white/gray placeholder edge leakage.
    prior_inpaint_mask_dilate: 3

    #### fast: 更快
    #### quality: 更稳，正式训练推荐使用
    prior_method: quality
    #### dataset 侧调试图保存开关
    debug_mode: false

    #### Simulate real missing inputs during training.
    #### white: fill masked pixels with 255 before prior/LUT/mu generation.
    observed_hole_fill: white
    observed_hole_fill_value: 255

    use_shuffle: true
    n_workers: 32
    batch_size: 16
    GT_size: 256
    min_hole_ratio: 0.005
    max_hole_ratio: 0.80
    max_crop_retry: 20
    use_flip: true
    use_rot: true
    color: RGB

#### Network
network_G:
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

#### Paths
#### 选择起点权重的建议：
####   推荐用原版十万步权重（ir-sde/models/best_G.pth），主干+guides 完全收敛
####   guides 位置已改回 downs[i][4]，可直接复用预训练权重里的 SPADEBlock 参数
path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train-3/texture/config/inpainting/log/ir-sde-brushnet-ft-x2/models/best_G.pth
  strict_load: false
  resume_state: ~

#### Training
train:
  optimizer: Adam
  lr_G: !!float 5e-6        # 预训练主干参数的学习率（低，保护已收敛权重）
  lr_new: !!float 1e-5      # 新增随机初始化模块的学习率（BrushNet、MGLC）

  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.999
  niter: 50000
  warmup_iter: 800
  lr_steps: [8000, 20000, 35000]
  lr_gamma: 0.5              # 每个节点 lr 减半
  eta_min: !!float 1e-7      # lr 下限

  is_weighted: False
  loss_type: l1
  weight: 1.0
  # Auxiliary supervision for the model-implied x0.  It keeps the final
  # reverse result in the target color domain and prevents white-hole
  # saturation that can be hidden by a low one-step x_t -> x_{t-1} loss.
  x0_recon_loss_weight: 0.03   # 大幅降低x0损失权重，减少高噪声下的不稳定性
  # 对高噪声 timestep 的 x0 损失做 timestep-aware 衰减，防止 t 接近 T 时 B(t) 很小导致 x0_hat 爆炸
  # weight_at_t = x0_recon_loss_weight * exp(-x0_high_t_decay * (t/T))
  # x0_high_t_decay=0 表示不衰减（等同于原来行为）
  x0_high_t_decay: 2.0        # t=T 时权重衰减到 exp(-2)≈0.135，t=0.65T 时约 exp(-1.3)≈0.27
                               # 配合 high_t_prob=0.60，让高噪声区域的 x0 损失不会主导梯度
  x0_recon_loss_start_iter: 0
  x0_recon_clamp_b_min: !!float 1e-3

  manual_seed: 0

#### Debug
debug:
  enabled: false
  log_dir: debug_logs/
  save_freq: 10
  save_items:
    - input_image
    - transformed_gt
    - generated_prior
    - confidence_map
    - masked_input

#### Logger
logger:
  print_freq: 100
  save_checkpoint_freq: 2000  
  best_save_start_iter: 2000
  use_tb_logger: true
