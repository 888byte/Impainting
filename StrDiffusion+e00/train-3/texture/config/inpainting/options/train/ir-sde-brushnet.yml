#### BrushNet + MGLC-Tex enhanced training config

name: ir-sde-brushnet
use_tb_logger: true
model: denoising
distortion: inpainting
gpu_ids: [0]

#### SDE
sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

#### Degradation
degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

#### BrushNet
brushnet:
  enabled: true
  in_nc: 8
  nf: 64
  depth: 4
  lite: false
  prior_dropout_prob: 0.3

#### Main trunk guidance compatibility field
#### Keep this disabled so the main repair path stays aligned with original
#### StrDiffusion semantics: cond/mu = observed_masked input.
main_guidance:
  enabled: false
  use_observed_input: true
  use_mask: true
  zero_init: true

#### Texture core final enhanced version
texture_core:
  enabled: true
  name: MGLCBlock
  insert_mid: true
  insert_dec: true
  backend: sem_lite
  branch_mode: both
  use_mask_gate: true
  gate_hidden: 16
  boundary_width: 3
  zero_init_last: true

#### Baseline compatibility fix only; not counted as innovation
restore_S_guidance: true

#### Self-Supervised Mu-Denoiser 配置 (D_mu)
# 在 SDE 训练前清理条件均值 mu，使用 blind-spot 自监督训练（不需要干净 GT）
mu_denoiser:
  enabled: true
  in_nc: 5
  dim: 32
  num_blocks: 2
  num_heads: 4
  predict_residual: true
  blind_ratio: 0.1
  lambda_ss: 1.0
  lambda_tv: 0.01
  lr: !!float 1e-4
  sde_warmup_iter: 1000

#### Dataset
datasets:
  train:
    name: MuralInpainting_Dataset
    mode: mural_inpainting
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/train/cropped_images
    dataroot_mask: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

    #### full: 整图颜色恢复 + 修补
    #### partial: 已知区尽量保留，仅 hole 区使用 LUT 目标
    gt_mode: full

    #### 必须显式提供 LUT 文件，不再回退旧默认值
    lut_path: /home/610-wws/Impainting/SSD-TS/pigment_lut49_xhq.npz
    lut_alpha: 0.85
    lut_beta: 0.15
    lut_inpaint_method: telea
    lut_strength: 0.7
    lut_smooth_radius: 1
    prior_hole_max_weight: 0.5

    #### fast: 更快
    #### quality: 更稳，正式训练推荐使用
    prior_method: quality
    #### 是否保存 dataset 侧调试图
    debug_mode: false

    use_shuffle: true
    n_workers: 32
    batch_size: 16
    GT_size: 256
    min_hole_ratio: 0.005
    max_hole_ratio: 0.80
    max_crop_retry: 20
    use_flip: true
    use_rot: true
    color: RGB

#### Network
network_G:
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

#### Paths
path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train/experiments/inpainting/ir-sde/models/best_G.pth
  strict_load: false
  resume_state: ~

#### Training
train:
  optimizer: Adam
  lr_G: !!float 1e-5
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.999
  niter: 150000
  warmup_iter: 5000
  lr_steps: [40000, 80000, 110000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0

#### Debug  长图保存
debug:
  enabled: false
  log_dir: debug_logs/
  save_freq: 10
  save_items:
    - input_image
    - transformed_gt
    - generated_prior
    - confidence_map
    - masked_input

#### Logger
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
