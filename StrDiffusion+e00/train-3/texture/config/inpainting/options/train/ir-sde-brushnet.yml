#### BrushNet + MGLC-Tex enhanced training config

name: ir-sde-brushnet
use_tb_logger: true
model: denoising
distortion: inpainting
gpu_ids: [0]

#### SDE
sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

#### Degradation
degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

#### BrushNet
brushnet:
  enabled: true
  in_nc: 8
  nf: 64
  depth: 4
  lite: false

#### Texture core final enhanced version
texture_core:
  enabled: true
  name: MGLCBlock
  insert_mid: true
  insert_dec: true
  backend: sem_lite
  branch_mode: both
  use_mask_gate: true
  gate_hidden: 16
  boundary_width: 3
  zero_init_last: true

#### Baseline compatibility fix only; not counted as innovation
restore_S_guidance: true

#### Self-Supervised Mu-Denoiser閰嶇疆 (D_mu)
# 鍦⊿DE璁粌鍓嶆竻鐞嗘潯浠跺潎鍊糾u锛屼娇鐢╞lind-spot鑷洃鐫ｈ缁冿紙涓嶉渶瑕佸共鍑€GT锛?
mu_denoiser:
  enabled: true
  in_nc: 5
  dim: 32
  num_blocks: 2
  num_heads: 4
  predict_residual: true
  blind_ratio: 0.1
  lambda_ss: 1.0
  lambda_tv: 0.01
  lr: !!float 1e-4

#### Dataset
datasets:
  train:
    name: MuralInpainting_Dataset
    mode: mural_inpainting
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/train/cropped_images
    dataroot_mask: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

    gt_mode: full

    lut_path: /home/610-wws/Impainting/SSD-TS/pigment_lut49_xhq.npz
    lut_alpha: 0.7
    lut_beta: 0.3
    lut_inpaint_method: telea
    lut_strength: 0.7
    lut_smooth_radius: 5

    prior_method: fast
    debug_mode: false

    use_shuffle: true
    n_workers: 16
    batch_size: 16
    GT_size: 256
    use_flip: true
    use_rot: true
    color: RGB

#### Network
network_G:
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

#### Paths
path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train/experiments/inpainting/ir-sde/models/best_G.pth
  strict_load: false
  resume_state: ~

#### Training
train:
  optimizer: Adam
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.999
  niter: 150000
  warmup_iter: 5000
  lr_steps: [40000, 80000, 110000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0

#### Debug
debug:
  enabled: false
  log_dir: debug_logs/
  save_freq: 10
  save_items:
    - input_image
    - transformed_gt
    - generated_prior
    - confidence_map
    - masked_input

#### Logger
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
