name: ir-sde-brushnet-ft-x38-x30resume-restoreSmu-spadepretrained
use_tb_logger: true
model: denoising
distortion: inpainting
gpu_ids: [0]

sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks

brushnet:
  enabled: true
  in_nc: 8
  nf: 64
  depth: 4
  prior_dropout_prob: 0.20
  feature_scale: 0.01
  use_spatial_gate: true
  use_confidence_gate: false
  confidence_floor: 0.0
  input_source: observed_known
  bootstrap_from_pretrained_trunk: true
  bootstrap_reset_zero_convs: true

main_guidance:
  enabled: false
  use_observed_input: true
  use_mask: true
  zero_init: true

texture_core:
  enabled: true
  name: MGLCBlock
  insert_mid: true
  insert_dec: true
  backend: sem_lite
  branch_mode: both
  use_mask_gate: true
  gate_hidden: 16
  boundary_width: 3
  zero_init_last: true

restore_S_guidance: true
restore_S_guidance_scale: 1.0

mu_denoiser:
  enabled: true
  in_nc: 5
  dim: 32
  num_blocks: 2
  num_heads: 4
  predict_residual: true
  use_for_condition_mu: false
  blind_ratio: 0.1
  lambda_ss: 1.0
  lambda_tv: 0.01
  lr: !!float 5e-5
  sde_warmup_iter: 1000

datasets:
  train:
    name: MuralPairedInpainting_Dataset
    mode: mural_paired_inpainting
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/train/cropped_images
    dataroot_degraded: /home/610-wws/Impainting/dataset/裁剪的图片/train/mask_merge
    dataroot_mask: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks
    gt_mode: paired_true
    main_target_domain: gt
    condition_mu_domain: degraded
    structure_source_domain: prefill
    lut_path: /home/610-wws/Impainting/SSD-TS/pigment_lut49_xhq.npz
    lut_alpha: 0.85
    lut_beta: 0.15
    lut_inpaint_method: telea
    lut_strength: 1.0
    lut_fade_boost: 3.0
    lut_smooth_radius: 1
    prior_hole_max_weight: 0.5
    prior_lut_gap_scale: 0.15
    prior_inpaint_mask_dilate: 3
    prior_method: quality
    debug_mode: false
    observed_hole_fill: white
    observed_hole_fill_value: 255
    refine_mask_from_observed_white: true
    mask_white_refine_threshold: 0.93
    mask_white_refine_dilate: 10
    mask_white_refine_expand: 1
    use_shuffle: true
    n_workers: 32
    batch_size: 16
    GT_size: 256
    min_hole_ratio: 0.005
    max_hole_ratio: 0.80
    max_crop_retry: 20
    use_flip: true
    use_rot: true
    color: RGB

network_G:
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train-3/experiments/inpainting/ir-sde-brushnet-ft-x30-x28resume-overnight-texturecore/models/best_G.pth
  expected_pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train-3/experiments/inpainting/ir-sde-brushnet-ft-x30-x28resume-overnight-texturecore/models/best_G.pth
  pretrain_model_G_fallback: /home/610-wws/Impainting/StrDiffusion+e00/train/texture/config/inpainting/log/ir-sde/models/best_G.pth
  pretrain_model_G_fallback_only_missing: true
  strict_load: false
  resume_state: null

train:
  optimizer: Adam
  lr_G: !!float 2e-7
  lr_new: !!float 1e-6
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.999
  niter: 12000
  warmup_iter: 200
  lr_steps: [6000, 9000]
  lr_gamma: 0.5
  eta_min: !!float 5e-8
  freeze_pretrained_until_iter: 0
  freeze_loaded_pretrained_only: true
  is_weighted: false
  loss_type: l1
  weight: 1.0
  color_aux_loss_weight: 0.0
  color_aux_target_domain: lut
  color_aux_loss_start_iter: 0
  color_aux_blur_kernel: 11
  color_aux_clamp_b_min: !!float 1e-3
  sde_mu_hole_mode: known_only
  main_state_mode: hybrid_mid_blank_hole
  main_t_min_ratio: 0.65
  main_t_max_ratio: 1.0
  main_mid_blank_ratio_start: 0.10
  main_mid_blank_ratio: 0.10
  main_mid_blank_ratio_warmup_iter: 0
  main_mid_t_min_ratio: 0.35
  main_mid_t_max_ratio: 0.60
  infer_x0_loss_weight: 0.002
  infer_x0_loss_start_iter: 0
  infer_x0_t_min_ratio: 0.65
  infer_x0_t_max_ratio: 1.0
  infer_x0_grad: true
  infer_x0_loss_interval: 1
  infer_x0_microbatch: 4
  infer_x0_mid_loss_weight: 0.0015
  infer_x0_mid_loss_start_iter: 0
  infer_x0_mid_t_min_ratio: 0.20
  infer_x0_mid_t_max_ratio: 0.55
  infer_x0_mid_grad: true
  infer_x0_mid_loss_interval: 1
  infer_x0_mid_microbatch: 4
  texture_hf_loss_weight: 0.0
  texture_hf_mid_loss_weight: 0.005
  texture_hf_mid_loss_start_iter: 0
  texture_hf_mid_blur_kernel: 11
  require_infer_x0_grad_for_known_only: true
  manual_seed: 0

debug:
  enabled: false
  log_dir: debug_logs/
  save_freq: 10

logger:
  print_freq: 20
  save_checkpoint_freq: 1000
  best_save_start_iter: 2000
  use_tb_logger: true
