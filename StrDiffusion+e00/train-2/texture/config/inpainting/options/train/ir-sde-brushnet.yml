#### 壁画修复 BrushNet 训练配置
# 本配置文件用于集成 BrushNet 的 StrDiffusion 训练
# 独立于原始 ir-sde.yml，不影响原有代码

name: ir-sde-brushnet
use_tb_logger: true
model: denoising
distortion: inpainting
gpu_ids: [0]

#### SDE配置
sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

#### 退化配置
degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks  # 修改为实际掩码目录

#### BrushNet配置
brushnet:
  enabled: true        # 是否启用BrushNet
  in_nc: 8             # 输入通道数 (3+1+3+1)
  nf: 64               # 基础特征通道数（与主UNet对齐）
  depth: 4             # 下采样深度（与主UNet对齐）
  lite: false          # 是否使用轻量版

#### ChromaRefiner配置
# 轻量级色度去噪网络，对输入图像进行 Lab 空间去噪
# 目的: 消除输入图像的颜色噪声，使 LUT 变换后得到更均匀的颜色
# 方法: 自监督边缘感知平滑（无需干净参考图）
chroma_refiner:
  enabled: true          # 是否启用 ChromaRefiner
  in_channels: 6         # 输入通道数: ab(2)+L(1)+填充(3)
  hidden_channels: 32    # 隐藏层通道数 (可调整: 24/32/48)
  num_blocks: 1          # Transformer block数量 (可调整: 1/2)
  num_heads: 4           # 注意力头数
  expand_ratio: 2        # GDFN扩展比例
  output_scale: 0.1      # 修正幅度（降低以防止过度修改）
  learnable_scale: true  # 缩放因子是否可学习
  
  # 训练配置 - 自监督边缘感知平滑
  lr: !!float 1e-4       # 学习率
  lambda_ref: 0.5        # Refiner总loss权重（增大以增强去噪效果）
  lambda_fid: 1.0        # 保真项权重（防止过度修改）
  lambda_smooth: 2.0     # 边缘感知平滑权重（控制平滑强度）





#### 数据集配置
datasets:
  train:
    name: MuralInpainting_Dataset
    mode: mural_inpainting
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/train/cropped_images # 修改为实际图像目录
    dataroot_mask: /home/610-wws/Impainting/dataset/裁剪的图片/train/output_masks # 可选，不提供则动态生成
    
    # GT生成模式选项:
    # - full: 全图LUT映射（模型学习恢复整张图的颜色）
    # - partial: 仅Mask区域LUT映射（保留背景，修复局部）
    # - mixed: 训练时随机选择 full 或 partial（各50%概率）
    gt_mode: partial
    
    # LUT配置（放在这里便于数据集直接读取）
    lut_path: /home/610-wws/Impainting/SSD-TS/pigment_lut33.npz
    lut_alpha: 0.7            # LUT置信度权重
    lut_beta: 0.3             # 修复置信度权重
    lut_inpaint_method: telea # 修复方法: telea 或 ns
    
    # 颜色先验生成方法:
    # - fast: 快速版（训练用）- Lab空间+双边滤波+空间置信度
    # - quality: 高质量版（推理用）- Lab空间+多尺度+导向滤波
    prior_method: fast
    
    # 调试模式（数据集级别）
    debug_mode: false
    
    use_shuffle: true
    n_workers: 32
    batch_size: 32
    GT_size: 256
    use_flip: true
    use_rot: true
    color: RGB


#### 网络结构
network_G:
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

#### 路径配置
path:
  # 预训练模型（可选）
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train/experiments/inpainting/ir-sde/models/best_G.pth
  strict_load: false
  # 恢复训练状态（可选）
  resume_state: ~

#### 训练设置
train:
  optimizer: Adam
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.999
  niter: 150000
  warmup_iter: 5000
  lr_steps: [40000, 80000, 110000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # 损失函数
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0

#### Debug配置
debug:
  # 是否开启调试模式
  enabled: false
  # 调试输出目录
  log_dir: debug_logs/
  # 保存频率（每N个iteration保存一次）
  save_freq: 10
  # 保存的内容：input_image, transformed_gt, generated_prior, confidence_map, masked_input
  save_items:
    - input_image
    - transformed_gt
    - generated_prior
    - confidence_map
    - masked_input

#### 日志配置
logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
