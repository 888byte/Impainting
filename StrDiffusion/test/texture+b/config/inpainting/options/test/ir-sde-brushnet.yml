#### 壁画修复 BrushNet 测试配置
# 本配置用于集成 BrushNet 的推理测试
name: ir-sde-brushnet
suffix: ~
model: denoising
distortion: inpainting
gpu_ids: [0]

sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/test1/output_masks

#### BrushNet配置
brushnet:
  enabled: true        # 是否启用BrushNet
  in_nc: 8             # 输入通道数 (3+1+3+1)
  nf: 64               # 基础特征通道数
  depth: 4             # 下采样深度
  lite: false          # 是否使用轻量版

#### LUT配置（用于颜色先验生成）
lut:
  path: /home/610-wws/Impainting/SSD-TS/pigment_lut33.npz
  alpha: 0.7           # LUT置信度权重
  beta: 0.3            # 修复置信度权重
  inpaint_method: telea
  prior_method: quality  # 推理时使用高质量版
  
  # 推理模式选项:
  # - full: 全图LUT映射（恢复整张图的颜色，即全局褪色修复）
  # - partial: 仅Mask区域LUT映射（保留背景，修复局部褪色区域）
  gt_mode: partial

#### 数据集配置
datasets:
  test1:
    name: Val_Dataset
    mode: GT
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/test1/cropped_images

#### 网络结构
network_G:
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4
    
network_Gs:
  which_model_G: ConditionalUNets
  setting:
    in_nc: 1
    out_nc: 1
    nf: 64
    depth: 4


path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train-2/texture/config/inpainting/log/ir-sde-brushnet/models/best_G.pth
  pretrain_model_Gs: /home/610-wws/Impainting/StrDiffusion+e00s/train/structure/config/inpainting/log/ir-sde/models/best_G.pth
  pretrain_model_D: /home/610-wws/Impainting/StrDiffusion/test/discriminator.pth
  strict_load: false
