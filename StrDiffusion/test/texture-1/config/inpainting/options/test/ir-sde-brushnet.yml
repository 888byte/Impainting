#### 官方骨架保留的最终增强版推理配置
#### 使用命令:
####   python test.py -opt options/test/ir-sde-brushnet.yml
####   python test.py -opt options/test/ir-sde-brushnet.yml --set texture_core.enabled=false

#### 基本设置
name: ir-sde-brushnet-infer
suffix: ~
model: denoising
distortion: inpainting
gpu_ids: [0]

#### 颜色纹理 SDE 配置
#### - max_sigma / T / schedule / eps 与训练侧保持一致
sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

#### 退化相关设置
#### - mask_root 保留官方字段，legacy 模式仍可使用
degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/test/output_masks

#### 数据集配置
datasets:
  test:
    #### 数据集名称，仅用于结果目录命名
    name: Mural_Inference_Dataset
    #### mural_inference 表示真实壁画推理模式
    mode: mural_inference

    #### 褪色/退化输入图像目录
    dataroot_degraded: /home/610-wws/Impainting/dataset/裁剪的图片/test/mask_merge
    #### 掩码目录，白色表示待修复区域
    dataroot_mask: /home/610-wws/Impainting/dataset/裁剪的图片/test/output_masks
    #### 可选 GT 目录，仅用于评估和对照可视化
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/test/cropped_images

    #### 可选预生成先验目录；如果为空则推理时自动生成
    dataroot_color_prior: ~
    #### 可选预生成置信度目录；如果为空则推理时自动生成
    dataroot_confidence: ~

    #### full: 输出整图
    #### partial: 已知区域保留原输入，只替换待修复区域
    gt_mode: full

    #### LUT 配置，需与训练侧保持一致
    lut_path: /home/610-wws/Impainting/SSD-TS/pigment_lut49_xhq.npz
    lut_alpha: 0.85
    lut_beta: 0.15
    lut_inpaint_method: telea
    lut_strength: 1.0
    lut_smooth_radius: 1
    prior_hole_max_weight: 0.5
    #### 颜色先验生成方法：
    #### - fast: 更快
    #### - quality: 更稳，更适合正式推理
    prior_method: quality

#### 纹理网络 G
network_G:
  #### 最终增强版纹理网络
  which_model_G: ConditionalUNetWithBrushNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4

#### 结构网络 Gs
#### - 保留官方配置骨架
#### - restore_S_guidance=true 时继续参与结构引导
network_Gs:
  which_model_G: ConditionalUNets
  setting:
    in_nc: 1
    out_nc: 1
    nf: 64
    depth: 4

#### BrushNet 条件注入开关
brushnet:
  enabled: true
  in_nc: 8
  nf: 64
  depth: 4
  lite: false
  # 训练时用于抑制主干直接抄 prior；推理阶段该值不生效，仅保留镜像配置。
  prior_dropout_prob: 0.0

#### 主干观测引导兼容字段
#### - 默认保持关闭
#### - 当前主干修复语义固定回归原版 StrDiffusion：
####   cond/mu = observed_masked input
main_guidance:
  enabled: false
  use_observed_input: true
  use_mask: true
  zero_init: true

#### MGLC-Tex 纹理增强模块
#### 这些开关同时用于最终模型和后续消融
texture_core:
  enabled: true
  name: MGLCBlock
  insert_mid: true
  insert_dec: true
  backend: sem_lite
  branch_mode: both
  use_mask_gate: true
  gate_hidden: 16
  boundary_width: 3
  zero_init_last: true

#### 是否恢复 legacy S 引导路径
#### - true: Gs + S_sde 参与结构引导
#### - false: 仍加载 Gs/Dis，但纹理网络前向不使用 S
restore_S_guidance: true

#### Mu-Denoiser 配置
#### - 用于清理已知区域的条件均值 mu
mu_denoiser:
  enabled: true
  in_nc: 5
  dim: 32
  num_blocks: 2
  num_heads: 4
  predict_residual: true
  blind_ratio: 0.1
  lambda_ss: 1.0
  lambda_tv: 0.01
  lr: !!float 1e-4

#### 权重路径
#### - 三个路径都保留，兼容官方骨架
path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train-3/texture/config/inpainting/log/ir-sde-brushnet-ft/models/best_G.pth
  pretrain_model_Gs: /home/610-wws/Impainting/StrDiffusion+e00s/train/structure/config/inpainting/log/ir-sde/models/best_G.pth
  pretrain_model_D: /home/610-wws/Impainting/StrDiffusion/test/discriminator.pth
  strict_load: false
  resume_state: ~

#### 推理阶段专用开关
inference:
  #### auto / brushnet_final / legacy
  #### - auto: 按 network_G 自动选择
  mode: brushnet_final
  #### auto: full 对应整图输出，partial 对应已知区保留
  compose_mode: auto
  #### 是否保存 reverse 过程状态图
  save_states: true
  #### 是否保存诊断图
  #### - 建议排查 bad case 时保持 true
  #### - 会额外输出 color_prior_lut / color_prior_inpainted / training_target_like
  save_intermediates: true
  #### 判别器引导开关
  discriminator_guidance:
    enabled: true
