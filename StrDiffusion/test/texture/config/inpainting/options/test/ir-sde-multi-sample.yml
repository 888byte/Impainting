#### general settings
name: ir-sde-multi-sample
suffix: ~  # add suffix to saved images
model: denoising
distortion: derain
gpu_ids: [0]
base_seed: 1234
seed_stride: 17
num_samples: 6
save_states: false
output_tag: multi_sample
texture_noise_scale: 3.5
structure_noise_scale: 2.5
# false: keep known area fixed, only make the hole highly random
# true: even the known region state is noised, diversity will be larger but quality usually worse
noise_known_region: false
# Optional: only run one specified image stem, e.g. real-147_center
# If you accidentally fill real-147_center_mask, the copied script will auto-strip the trailing "_mask".
fixed_image_name: ~
# Optional: if set, this single mask will be used for all images.
fixed_mask_path: ~
# Mask resize size
mask_size: 256

sde:
  max_sigma: 30
  T: 400
  schedule: cosine
  eps: 0.005

degradation:
  mask_root: /home/610-wws/Impainting/dataset/裁剪的图片/test1/output_masks
  
  
#### datasets
datasets:
  test1:
    name: Val_Dataset
    mode: GT
    dataroot_GT: /home/610-wws/Impainting/dataset/裁剪的图片/test1/cropped_images

#### network structures
network_G:
  which_model_G: ConditionalUNet
  setting:
    in_nc: 3
    out_nc: 3
    nf: 64
    depth: 4
    
network_Gs:
  which_model_G: ConditionalUNets
  setting:
    in_nc: 1
    out_nc: 1
    nf: 64
    depth: 4


path:
  pretrain_model_G: /home/610-wws/Impainting/StrDiffusion+e00/train/texture/config/inpainting/log/ir-sde/models/best_G.pth
  pretrain_model_Gs: /home/610-wws/Impainting/StrDiffusion+e00s/train/structure/config/inpainting/log/ir-sde/models/best_G.pth
  pretrain_model_D: /home/610-wws/Impainting/StrDiffusion/test/discriminator.pth
